name: OBDLevel
options:
  bundleIdPrefix: com.dot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  OBDLevel:
    type: application
    platform: iOS
    sources:
      - path: OBDLevel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dot.obdlevel
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Level
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Connects to the OBDeleven adapter to read suspension heights and run routines."
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "Connects to the OBDeleven adapter."
        CODE_SIGN_STYLE: Automatic
